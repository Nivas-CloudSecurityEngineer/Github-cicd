name: Run Nginx

on:
  workflow_dispatch:

jobs:
  nginx:  
    runs-on: ubuntu-latest

    steps:
      - name: Start Nginx Container
        run: |
          docker run -d -p 8080:80 --name my-nginx nginx:alpine
          sleep 3

      - name: Expose Nginx via Public URL
        run: |
          # 1. Install localtunnel globally using npm (pre-installed on the runner)
          sudo npm install -g localtunnel
          
          # 2. Expose port 8080 to the internet
          lt --port 8080
