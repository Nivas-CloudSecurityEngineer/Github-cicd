name: Run Nginx

on:
  workflow_dispatch:

jobs:
  nginx:  
    runs-on: ubuntu-latest

    steps:
      - name: Start Nginx Container
        run: |
          docker run -d -p 8080:80 --name my-nginx nginx:alpine
          sleep 3

      - name: Expose Nginx via ngrok URL
        run: |
          # 1. Install official ngrok repository and signing keys via official script
          curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          
          # 2. Update and install the ngrok binary safely
          sudo apt-get update && sudo apt-get install ngrok -y
          
          # 3. Start the tunnel on port 8080
          ngrok http 8080 --log=stdout
