name: Run Nginx

on:
  workflow_dispatch:

jobs:
  nginx:  
    runs-on: ubuntu-latest

    steps:
      - name: Start Nginx Container
        run: |
          docker run -d -p 8080:80 --name my-nginx nginx:alpine
          sleep 3

      - name: Download and Run ngrok Binary Directly
        run: |
          # 1. Download the official Linux archive directly
          curl -sSOL https://equinox.io
          
          # 2. Extract it into a globally accessible location (/usr/local/bin)
          sudo tar -xzf ngrok-v3-stable-linux-amd64.tgz -C /usr/local/bin
          
          # 3. Clean up the downloaded archive
          rm ngrok-v3-stable-linux-amd64.tgz
          
          # 4. Start the tunnel on port 8080
          ngrok http 8080 --log=stdout
